# ftpd.conf — configuration for the Week 09 FTP server
#
# Changes here take effect on the NEXT server start (not live-reload).
# Uncomment and edit lines to override the compiled-in defaults.
#
# To disable a service, set its allow_* flag to 0 and restart ftpd.
# This satisfies the Session 9 requirement: "configuration changes behavior".

# Control port (default: 21021)
port = 21021

# Per-feature enable flags (1 = enabled, 0 = disabled)
allow_list = 1
allow_retr = 1
allow_stor = 1
allow_mkd  = 1

# Maximum file size for STOR uploads, in kilobytes (0 = unlimited)
max_file_kb = 0
